#:schema ./schemas/config-schema.json
# counter configuration file
#
# Every section and key is optional; absent keys use the built-in defaults. Every
# value below IS that default, so copying this file whole changes nothing.
# scripts/check_config_schema.py enforces that against include/config.hpp as part
# of the lint target -- a default may not drift from this template.
#
# What each key means is in schemas/config-schema.json, which an editor reads via
# the #:schema line above. What to set and why -- the measurements behind each
# default -- is in docs/configuration.rst. Comments here cover only what neither
# of those records.

[genetic]
generations     = 10
population_size = 200
selection_rate  = 0.5
elitism_rate    = 0.0  # off. Elites are a subset of the parents, so any non-zero
                       # value must stay < selection_rate. Redundant on paper under
                       # NSGA-II and measurably worse for TLSF yield; 0.1 costs less
                       # wall time, which no longer binds -- see include/config.hpp.
crossover_rate  = 0.1
mutation_rate   = 1.0  # per offspring, unlike the per-requirement rates in [mutation]
# "nsga2-truncate" | "nsga2-apportion" | "weighted". Under either NSGA-II scheme
# the [fitness] weights only select which components are active (weight > 0);
# they no longer bias selection, and the (mu+lambda) survivor pooling is already
# elitist, so elitism_rate = 0 is the natural companion on paper, and is the
# default since 2026-08-21.
# The two NSGA-II schemes rank identically and differ only in the survivor step.
# "nsga2-truncate" was the default until 2026-08-14; it costs about 26% less
# wall time on FRETISH and 13% less on TLSF, and is the arm to reach for when
# throughput matters more than how many repairs come back.
selection_scheme = "nsga2-apportion"
# Report every candidate that passed the output gate in any generation, not only
# the ones the final population still holds. Off by default: it changes what a
# run emits, and it costs a gate sweep per generation on the TLSF path (free on
# the FRETISH one, which already asks). Inert under [tlsf] repair_mode = "muc".
accumulate_repairs = false

[fitness]
weight_syntactic = 0.2
weight_semantic  = 0.5
weight_status    = 0.5
# "mrs" grades the unrealizable region by the fraction of guarantee-side parts a
# greedy sweep keeps realizable; "tiered" collapses that whole region to 0.5.
status_grading   = "mrs"  # or "tiered"
# Which order that sweep admits parts in. "degree" defers the parts that
# conflict with most others, costing one pairwise pass over the input before the
# search starts; "spec" is the specification's own index order.
mrs_admission_order = "degree"  # or "spec"

[mutation]
# Per-requirement probabilities of rewriting each part of a FRETISH requirement.
p_trigger  = 0.5
p_response = 0.5
p_timing   = 0.15
# Both modes: the probability that a mutation instead appends a new environment
# assumption, and the fraction of those guarded by a random input atom rather
# than by `true`.
p_add_assumption         = 0.05
p_conditional_assumption = 0.25
# The mirror action: delete a guarantee outright, never the last live one.
# Some repairs are unreachable without it. Set to 0 to reproduce a run from
# before the operator existed.
p_remove_guarantee       = 0.05
strengthen_assumptions   = true
allow_output_assumptions = true  # guarded by the status score, not by a filter

[tlsf]
# TLSF mode only (a .tlsf input or --format tlsf); ignored on the FRETISH path.
repair_mode        = "monolithic"  # or "muc"
muc_max_iterations = 32            # muc mode only

[tlsf.mutation]
p_assumption = 0.3
p_temporal   = 0.2
# A rewrite whose result is comparable to what it replaces under implication,
# offered ahead of the other two. Set to 0 to reproduce a run from before the
# arm existed.
p_monotone   = 0.25
# Of the assumptions [mutation] p_add_assumption appends, the fraction that copy
# an existing one instead of building from the template, which emits at most
# seven nodes where the assumption-shaped ideals run to thirty.
p_clone_assumption = 0.25

[model_counting]
default_bound = 20
metric        = "logarithmic"  # or "direct"

[filters]
run_weakening   = false
run_implication = true
run_vacuity     = true
run_well_separation = false

[runtime]
# Per-call wall-clock budgets in ms; 0 disables one. Only ganak is unbounded:
# counting is the fitness function's real work, so a slow count is usually a
# legitimately hard one rather than a blowup. The rest are bounded because an
# unbounded call can stall a whole run.
black_timeout_ms    = 1000
ltlsynt_timeout_ms  = 10000
ltl2tgba_timeout_ms = 60000
ltlfilt_timeout_ms  = 10000
ganak_timeout_ms    = 0
max_concurrent_realizability = 0
# 0.15, not 0.05: the ltl2tgba budget drops individuals by design, and enough
# land in one generation on the heavy TLSF specs to trip a tighter bound.
max_scoring_failure_rate     = 0.15
dashboard = false
# parallel = 8   # thread pool size; the default is hardware concurrency, so
                 # this key has no fixed default to pin and stays commented out.
