# Header form rather than an inline phases array: TOML inline tables may not
# span newlines, so a phase carrying its own hosts table cannot be written on
# one line without becoming unreadable.
name = "2026-08-11-selection-default"
branch = "campaign/selection-default"
profile = "seldefault-fret"
hosts = { av2 = "0-34", av3 = "35-69" }

[[phases]]
name = "fret"
profile = "seldefault-fret"
jobs = 4

[[phases]]
name = "fret-cm"
profile = "seldefault-fret-cm"
jobs = 4

# PLAN.md §4 sizes the TLSF path at 25 seeds over 20 families, against the
# FRETISH path's 70 over 4 specs; §7's power table is where both numbers come
# from. Without this override the campaign range would run the TLSF phases at
# 70 seeds, which is 4,200 rows against a plan of 1,500.
[[phases]]
name = "tlsf"
profile = "seldefault-tlsf"
jobs = 1
hosts = { av2 = "0-12", av3 = "13-24" }

[[phases]]
name = "tlsf-cm"
profile = "seldefault-tlsf-cm"
jobs = 1
hosts = { av2 = "0-12", av3 = "13-24" }
