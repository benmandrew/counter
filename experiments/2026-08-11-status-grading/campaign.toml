name = "2026-08-11-status-grading"
branch = "feat/mrs-status"
profile = "status-grading"
description = "Status objective grading scale: tiered (three-point) against mrs (greedy maximal-realizable-subset fraction), over the 20 TLSF ablation specs at gen10/pop200."

# Seeds 0-23 split evenly. Both arms of a pair run on the same host, so a host
# difference cancels within the (spec, seed) pair the endpoints are measured
# over -- av2 carries a llama-server on one of its 32 cores, and a pilot put the
# two hosts within 3.4% on a 93s run.
hosts = { av2 = "0-11", av3 = "12-23" }

# jobs = 1 for the RAM reason the other TLSF profiles use: ltlsynt runs
# multi-GB per call on these specs and max_concurrent_realizability is a
# per-process cap, so a second concurrent counter would double the ceiling.
phases = [ { profile = "status-grading", jobs = 1 } ]
