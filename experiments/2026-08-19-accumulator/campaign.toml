name = "2026-08-19-accumulator"
branch = "campaign/accumulator"
profile = "accumulator"
description = "The cross-generation accumulator off against on (TLSF sweep N) over the 25-family aurus-h2h corpus, paired by (spec, seed). Asks whether keeping every gate-passing candidate of every generation, rather than the final population's alone, adds repairs and what it costs."

# 4 seeds x 25 families x 2 arms = 200 runs, split evenly. The arms are paired
# within a seed, so both levels of a seed must run on the same host: the split
# is over seeds and never over levels, which run_experiments.py crosses itself.
hosts = { av2 = "0-1", av3 = "2-3" }

# Generated on the host at stage time, as aurus-h2h's are and for the same
# reason: the branch carries this declaration but not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory.
# --pin-vintage states every key whose default has moved, so the archive says
# what this run was rather than inheriting it from whatever the defaults become.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion --sweeps N --metric log --out-dir experiments/configs-accumulator --pin-vintage"

# jobs = 8, the value the aurus-h2h calibration cleared on this corpus: 24 runs
# over 12 families peaked at load 21.7 of 32 cores and 18.7 GB of 125 GB. The
# other TLSF profiles' jobs = 1 is a RAM argument that was measured on a
# different corpus and does not hold here.
phases = [ { profile = "accumulator", jobs = 8 } ]
