name = "ops-pilot"
branch = "fix/mutation-operators"
profile = "ops-pilot"
description = "Cap-sizing pilot for ops-grammar: times the three slowest H2H_TLSF families in both sweep-O arms at the campaign's operating point, under a deliberately non-binding cap, so the real caps are sized on observed tails rather than on a censored 2026-07-24 number."

# Same build hook as ops-grammar, and it must stay identical: this campaign
# reads configs-ops-tlsf, so a divergence would time a different config from the
# one the campaign runs. Wrapped in `sh -c` because campaign.py embeds the
# command as `if ! @BUILD@ ...` and `!` binds to the first pipeline of an
# AND-list, which silently reports a half-run stage as a success.
build = "sh -c 'cmake --build build-release && python3 scripts/gen_configs.py --schemes nsga2-truncate --sweeps O --generations 40 --population-size 1000 --out-dir experiments/configs-ops-fret && python3 scripts/gen_configs.py --tlsf --sweeps O --ltlsynt-timeout 10000 --ltl2tgba-timeout 60000 --max-scoring-failure-rate 0.15 --out-dir experiments/configs-ops-tlsf'"

# 2 seeds per host over 3 specs x 2 arms = 12 runs each. Both arms of a pair run
# on the same host, as in ops-grammar, so the arm ratio this measures is not
# confounded by a host difference.
hosts = { av2 = "0-1", av3 = "2-3" }

# jobs = 4, matching the phase this sizes, and the match is the whole point: the
# runner hands each counter parallel = cpu_count // jobs, so a run at jobs=1 gets
# four times the threads and finishes in a different wall time. A cap sized at
# the wrong concurrency censors, and PLAN.md section 8 registers that censoring
# as directional against the treatment arm. An earlier pass of this pilot ran at
# jobs=1; its rows were deleted rather than kept, since they size a campaign that
# is no longer the one being run.
[[phases]]
name = "pilot"
profile = "ops-pilot"
jobs = 4
