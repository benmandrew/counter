name = "ops-weakening"
branch = "campaign/ops-weakening"
profile = "opswk-tlsf"
description = "ops-grammar replicated with run_weakening = false, ahead of that becoming the binary default. An exact mirror of ops-grammar apart from the wkoff configs, so the two campaigns' rows assemble into a grammar x weakening 2x2 on identical (spec, seed) pairs."

# The campaign runs from its own branch, not fix/mutation-operators, and that is
# load-bearing rather than cosmetic. campaign.py stage_refusals compares branch
# NAMES only, and the tick auto-stage answers the branch refusal alone -- so an
# entry naming the branch the checkout already sits on never auto-stages, never
# runs the build hook below, and dies on configs that were never generated. A
# distinct branch makes the mismatch the tick knows how to resolve unattended.
#
# Identical in shape to ops-grammar's hook, and `sh -c` for the same reason:
# campaign.py embeds the command as `if ! @BUILD@ ...`, `!` binds to the first
# pipeline of an AND-list, and a bare `a && b` runs `a`, short-circuits `b` away
# and still reports the stage a success.
build = "sh -c 'cmake --build build-release && python3 scripts/gen_configs.py --schemes nsga2-truncate --weakening off --sweeps O --generations 40 --population-size 1000 --out-dir experiments/configs-opswk-fret && python3 scripts/gen_configs.py --tlsf --weakening off --sweeps O --ltlsynt-timeout 10000 --ltl2tgba-timeout 60000 --max-scoring-failure-rate 0.15 --out-dir experiments/configs-opswk-tlsf'"

# The same split as ops-grammar, and it must stay the same: the 2x2 assembles on
# (spec, seed), and both arms of a pair sharing a host is what makes a host
# difference cancel inside the pair on this campaign as on that one.
hosts = { av2 = "0-9", av3 = "10-19" }

# FRETISH first, as in ops-grammar, and cheap for the same reason.
[[phases]]
name = "fret"
profile = "opswk-fret"
jobs = 4
hosts = { av2 = "0-14", av3 = "15-29" }

[[phases]]
name = "tlsf"
profile = "opswk-tlsf"
jobs = 4
