name = "aurus-h2h-ship"
branch = "campaign/aurus-h2h-ship"
profile = "aurus-h2h-ship"
description = "counter at the 2026-08-21 shipping configuration plus the accumulator, over the same 25 TLSF families and the same 7200s cap as 2026-08-14-aurus-h2h, so the archived AuRUS rows are answered at full power. Single arm: the 499 archived aurus-h2h counter rows are the control."

# The same split as aurus-h2h, and it has to stay the same. The control is that
# campaign's archived rows rather than a second arm here, so a seed is compared
# against the same seed on the same machine only if the two campaigns put it
# there. Moving the split would silently compare av2 rows against av3 ones.
hosts = { av2 = "0-9", av3 = "10-19" }

# Generated on the host at stage time, as aurus-h2h's are and for the same
# reason: the branch carries the declaration and not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory.
#
# Every flag here is load-bearing.
#   --tlsf                    sweep N is a TLSF sweep; without it the letter
#                             resolves against the FRETISH table.
#   --sweeps N --levels accon states accumulate_repairs = true in the config
#                             rather than crossing it. 2026-08-19-accumulator
#                             measured the key on its own; this campaign holds
#                             it on, and the level is how the archived config
#                             comes to say so.
#   --weakening off           run_weakening = false. gen_configs pins that key
#                             true in DEFAULTS and emits it unconditionally,
#                             deliberately not following the binary, so the
#                             factor directory is the only way to turn it off.
#   --schemes nsga2-apportion  } the binary defaults, stated because the TLSF
#   --metric log               } grid's own baselines are truncate and direct.
#   --ltlsynt-timeout 10000   restores the binary default that --tlsf would
#                             otherwise lower to 500 ms. aurus-h2h ran at
#                             10000 ms, having been generated without --tlsf,
#                             so this is what holds the two comparable.
#   --ltl2tgba-timeout 60000  } equal to the binary defaults aurus-h2h took
#   --max-scoring-failure-rate 0.15 } silently; stated for the archive.
#
# No --pin-vintage. It writes run_well_separation from gen_configs.DEFAULTS,
# whose entry has read true since the binary default went false in b101ada on
# 2026-08-10, so pinning would put the per-generation filter into the one arm
# meant to run counter as it ships -- which is how it reached aurus-h2h. The key
# is therefore absent and takes the binary default; PLAN.md section 3 records
# the value, as experiments/README.md's "Config vintage" note does elsewhere.
#
# sh -c, never a bare AND-list: campaign.py embeds this as `if ! @BUILD@ ...`,
# `!` binds to the first pipeline of an AND-list, and `a && b` would run `a`,
# short-circuit `b` away and still report the stage a success.
build = "sh -c 'cmake --build build-release'"
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion --metric log --weakening off --sweeps N --levels accon --ltlsynt-timeout 10000 --ltl2tgba-timeout 60000 --max-scoring-failure-rate 0.15 --out-dir experiments/configs-aurus-h2h-ship"

# One phase. jobs = 8 for the reason aurus-h2h's declaration records: the RAM
# argument behind jobs = 1 on the other TLSF profiles was never measured on this
# corpus and is wrong here, a 24-run calibration having peaked at 18.7 GB of
# 125 GB, and jobs = 1 costs about 31 hours per host against roughly 4.
phases = [ { profile = "aurus-h2h-ship", jobs = 8 } ]
