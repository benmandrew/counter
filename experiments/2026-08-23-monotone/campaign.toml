name = "monotone"
branch = "campaign/monotone"
profile = "monotone"
description = "counter on feat/monotone-operators over the same 25 TLSF families, 7200s cap and seed split as 2026-08-21-aurus-h2h-ship, whose archived rows are the control. Three arms attribute the branch's three changes one contrast at a time: monooff isolates the Implies grammar widening, monoon adds the monotone rewrite and the cloned assumption, monoship adds the elitism_rate default move and is the branch as it ships."

# The same split as aurus-h2h-ship, and before it aurus-h2h. The control is that
# campaign's archived rows rather than a fourth arm here, so seed 7 is compared
# against seed 7 only if both campaigns put it on the same machine. Moving the
# split would silently pair av2 rows against av3 ones.
hosts = { av2 = "0-9", av3 = "10-19" }

# Generated on the host at stage time, as aurus-h2h-ship's are and for the same
# reason: the branch carries the declaration and not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory.
#
# Every flag matches aurus-h2h-ship's line except --sweeps/--levels, which is
# the point: the two campaigns differ in the binary and in sweep T's four keys,
# and in nothing else. See TLSF_SWEEP_T in gen_configs.py for what each level
# states and why it states it rather than inheriting a default.
#
# No --pin-vintage, for the reason aurus-h2h-ship's declaration records: it
# writes run_well_separation from gen_configs.DEFAULTS, whose entry has read
# true since the binary default went false in b101ada on 2026-08-10. Pinning
# would put the per-generation filter into arms whose control ran without it.
build = "sh -c 'cmake --build build-release'"
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion --metric log --weakening off --sweeps T --levels monooff,monoon,monoship --ltlsynt-timeout 10000 --ltl2tgba-timeout 60000 --max-scoring-failure-rate 0.15 --out-dir experiments/configs-monotone"

# One phase, three arms inside it, 750 runs per host. jobs = 8 for the reason
# aurus-h2h-ship's declaration records: the RAM argument behind jobs = 1 on the
# other TLSF profiles was never measured on this corpus and is wrong here, a
# 24-run calibration having peaked at 18.7 GB of 125 GB. At the roughly 4.5
# hours per host aurus-h2h-ship took for one arm, this is about 13.
phases = [ { profile = "monotone", jobs = 8 } ]
