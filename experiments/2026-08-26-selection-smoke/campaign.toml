name = "selection-smoke"
branch = "campaign/selection-smoke"
profile = "selection-smoke"
description = "WeightedAverage against the shipped nsga2-apportion on the 21 cost-affordable TLSF families, at the 2026-08-26 shipping configuration with fitness weights 0.1/0.2/0.7 and selection_scheme as the only key that differs between the arms. A 2 h/host smoke test."

# Seeds 0-15 split evenly. Both arms of a pair run on the same host, so the
# split is over seeds and never over schemes -- run_experiments.py crosses the
# schemes itself, and a host difference then cancels within the (spec, seed)
# pair the endpoint is read over.
#
# 16 rather than monotone's 20: the budget is 2 h per host against that
# campaign's day, and 21 families x 16 seeds still gives 336 pairs. Sized from
# the 2026-08-23-monotone `monoon` arm, whose per-family means sum to 1807 s of
# serial work per (seed, arm) over this corpus -- so 16 seeds of both arms is
# about 28,900 serial seconds per host, roughly 80 minutes at jobs = 8 if the
# weighted arm costs what the nsga2 one does, and still inside 2 h at 1.5x.
hosts = { av2 = "0-7", av3 = "8-15" }

# Generated on the host at stage time, as every campaign since aurus-h2h has
# been: the branch carries this declaration but not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory.
#
# Sweep T at `monoon` is the level whose four keys all equal today's
# config.hpp defaults; --weakening off, --metric log and --pin-vintage state
# the rest. The two emitted configs differ in exactly one line,
# selection_scheme, which is the campaign's whole claim about itself.
#
# --weights 0.1 0.2 0.7 is the one deliberate departure from a default, and it
# is chosen rather than inherited. gen_configs.py otherwise pins the three
# weights at 0.33 each, which is neither the binary's 0.2 / 0.5 / 0.5 nor
# anything a user gets, so this campaign states the triple it means instead of
# taking whichever of the two it would have got by silence. The weighted arm
# ranks by exactly the scalar these define, so the value is a parameter of the
# question, not of the harness -- see PLAN.md section 4.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion weighted --sweeps T --levels monoon --metric log --weakening off --weights 0.1 0.2 0.7 --out-dir experiments/configs-selection-smoke --pin-vintage"

# jobs = 8, as monotone and aurus-h2h-ship ran it, which is what makes this
# campaign's wall times readable against theirs. The aurus-h2h calibration
# cleared it on this corpus at load 21.7 of 32 cores and 18.7 GB of 125 GB.
phases = [ { profile = "selection-smoke", jobs = 8 } ]
