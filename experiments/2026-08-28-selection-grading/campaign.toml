name = "2026-08-28-selection-grading"
branch = "campaign/selection-grading"
profile = "curves"
description = "A 2x2 TLSF ablation of selection_scheme (nsga2-apportion against weighted) crossed with fitness.status_grading (mrs against aurus), measuring repair discovery over time. Every arm runs generations = 500 under a per-run genetic.max_wall_s, so the deadline rather than the generation count is what ends every run and each arm gets the same wall clock."

# Seeds 0-5 split evenly. Both arms of a pair run on the same host, so the split
# is over seeds and never over the factors -- run_experiments.py crosses the two
# schemes and the two grading levels itself, and a host difference then cancels
# within the (spec, seed) cell the endpoint is read over.
#
# Six seeds is what the budget buys rather than what a power calculation asks
# for, this campaign reporting curves rather than testing a hypothesis. It must
# stay equal to the `curves` profile's seed list -- the two are the same number
# written twice, and a host range wider than that list runs nothing for the
# excess. Topping up later is free: run_experiments.py resumes off the results
# CSV key, so added seeds re-run nothing already done.
hosts = { av2 = "0-2", av3 = "3-5" }

# Generated on the host at stage time, as every campaign since aurus-h2h has
# been: the branch carries this declaration but not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory. Two
# calls joined with `&&`, one tree per profile, because run_id names collide
# across profiles and the two read different configs_dir paths.
#
# The flags, and why each is stated rather than inherited:
#
#   --sweeps G --levels mrs,aurus   the grading factor; the arm rides in
#                                   level_name, a key column already
#   --schemes nsga2-apportion weighted   the selection factor; the scheme is the
#                                   config directory read back into `selection`
#   --generations 500               far above what any of these families
#                                   reaches, so the deadline ends every run
#   --max-wall-s 400                the per-run internal deadline. counter stops
#                                   itself at the next generation boundary past
#                                   it and writes run.json and its repairs, so a
#                                   run that spends the budget is measured
#                                   rather than censored. The profile caps at
#                                   3600 s externally, since the deadline
#                                   interrupts neither the filters, the scoring,
#                                   nor the final realizability gate.
#
#                                   400 s is arithmetic rather than taste. No
#                                   run finishes early at generations = 500, so
#                                   every run spends its whole deadline and the
#                                   campaign's cost is exactly specs x arms x
#                                   seeds x cap: 25 x 4 x 6 x 400 s = 66.7 h
#                                   against a budget of 80 h, the remainder
#                                   being the post-deadline filtering the cap
#                                   does not bound
#   --parallel 1                    single-threaded runs. The endpoint is wall
#                                   time, so a scoring pool whose size varies
#                                   with --jobs would make it a property of the
#                                   host rather than of the arm. A stated
#                                   `parallel` also keeps run_experiments.py's
#                                   own per-run cap off it
#   --weights 0.1 0.2 0.7           AuRUS's published triple. Only the weighted
#                                   scheme reads them, so setting them globally
#                                   is correct and inert for the two
#                                   nsga2-apportion arms; stating them keeps the
#                                   archive self-describing instead of
#                                   inheriting either the binary's 0.2/0.5/0.5
#                                   or the 0.33 triple gen_configs.py pins
#   --metric log --weakening off    the shipping configuration, as monotone and
#                                   selection-smoke ran it
#   --pin-vintage                   writes the four moved defaults out. Note it
#                                   also writes status_grading, which sweep G
#                                   then overrides per level -- overrides win,
#                                   make_toml merging them last
#
# tlsf.repair_mode = "monolithic" and filters.run_implication = true reach the
# emitted TOML unconditionally from gen_configs.py's own DEFAULTS, both at the
# binary's value, so neither needs a flag. genetic.accumulate_repairs is the one
# fixed factor left to the binary default (true): gen_configs.py emits it only
# where a sweep overrides it, and no sweep G level does. Adding it to those
# levels would edit what the closed `status-grading` campaign's arms mean.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion weighted --sweeps G --levels mrs,aurus --metric log --weakening off --weights 0.1 0.2 0.7 --generations 500 --max-wall-s 400 --parallel 1 --out-dir experiments/configs-curves-calib --pin-vintage && python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion weighted --sweeps G --levels mrs,aurus --metric log --weakening off --weights 0.1 0.2 0.7 --generations 500 --max-wall-s 400 --parallel 1 --out-dir experiments/configs-curves --pin-vintage"

# One phase. jobs = 16 rather than the 1 the other TLSF profiles use: that 1 is
# a RAM argument about ltlsynt's multi-GB residency and a concurrency cap that
# is per counter process, sized for runs whose own thread pool was hardware
# concurrency. These runs are single-threaded, so each holds one ltlsynt at a
# time. Unverified pending the `curves-calib` phase, which is what reads the
# peak RSS back.
#
# The calibration phase is deliberately not declared here: it is run by hand
# once, its timings fix the seed count, and only then is this campaign enqueued.
phases = [ { profile = "curves", jobs = 16 } ]
