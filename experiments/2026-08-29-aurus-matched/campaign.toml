name = "2026-08-29-aurus-matched"
branch = "campaign/aurus-matched"
profile = "matched"
description = "counter against AuRUS on a common search budget. The 2026-08-28 selection x grading cross runs again under genetic.termination = \"individuals\" at max_individuals = 1000 and population 100, which is AuRUS's own stopping rule, so wall time becomes the measured outcome rather than the budget. 30 seeds a family, matching the 30 repeats AuRUS's archived corpus carries."

# Seeds 0-29 split evenly, matching AuRUS's 30 repeats a family so the two
# discovery curves are estimated off the same number of runs. The split is over
# seeds and never over the factors: both arms of a pair run on one host, so a
# host difference cancels inside the (spec, seed) cell the endpoint is read over.
# It must stay equal to the `matched` profile's seed list, the two being the same
# number written twice, and a host range wider than that list runs nothing for
# the excess.
hosts = { av2 = "0-14", av3 = "15-29" }

# Generated on the host at stage time, as every campaign since aurus-h2h has
# been: the branch carries this declaration and not the config tree, which is
# untracked, and run_experiments.py exits 1 on an empty configs directory.
#
# What the flags say, and why each is stated rather than inherited:
#
#   --termination individuals       AuRUS's rule. GeneticAlgorithm.java counts
#   --max-individuals 1000          once per accepted mutant and once per
#                                   crossover offspring distinct from its first
#                                   parent, checks the cap between offspring,
#                                   and every one of the 679 archived h2h logs
#                                   carrying a settings banner reads
#                                   GA_MAX_NUM_INDIVIDUALS=1000. Brizzio et al.,
#                                   GECCO '23 sec. 6: "the termination criterion
#                                   is reached either when 1000 individuals are
#                                   generated or after 2hrs of execution time."
#                                   It is not a cap on solutions -- no archived
#                                   run reached 1000 of those, median 486.
#   --population-size 100           GA_POPULATION_SIZE in the same banner. The
#                                   cap alone is not a match: 1000 individuals
#                                   at population 200 is half the generations of
#                                   1000 at population 100.
#   --generations 500               a ceiling that must not bind. counter breeds
#                                   population_size - elite_n = 90 offspring a
#                                   generation and counts only those differing
#                                   from their parent, so 1000 individuals needs
#                                   at least 12 generations. If `stopped_by`
#                                   reads `generations` on any row, that row is
#                                   measuring the wrong thing.
#   --parallel 1                    single-threaded, matching AuRUS, and
#                                   necessary rather than cosmetic here: wall
#                                   time is the endpoint, so a scoring pool
#                                   sized by --jobs would make the endpoint a
#                                   property of the host. It also keeps
#                                   run_experiments.py's own per-run cap off it.
#   --weights 0.1 0.2 0.7           the archived banner reads STATUS_FACTOR=0.7,
#                                   SYNTACTIC_FACTOR=0.1 and two counting terms
#                                   at 0.1 each, which is this triple with the
#                                   0.2 standing for the counting pair. Read
#                                   only by the weighted arm and inert for the
#                                   two nsga2-apportion ones. Note the paper
#                                   tunes these per case and reports its table
#                                   at the best configuration for each; the
#                                   archived AuRUS runs used one global setting,
#                                   as counter does here, so the head-to-head is
#                                   symmetric and neither side is the paper's.
#   --sweeps G --levels mrs,aurus   the grading factor, riding in level_name
#   --schemes nsga2-apportion weighted   the selection factor
#   --metric log --weakening off    the shipping configuration
#   --pin-vintage                   writes the moved defaults out explicitly
#
# There is deliberately no `max_wall_s` here. AuRUS stops on whichever of 1000
# individuals or 7200 s comes first, and this campaign gives counter the same
# pair: the individuals cap, and the profile's 7200 s external cap. So a run
# whose manifest reads `stopped_by = individuals` spent its whole budget with
# the deadline slack, and adding an internal deadline would only make a second
# rule bind where AuRUS's does not.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion weighted --sweeps G --levels mrs,aurus --metric log --weakening off --weights 0.1 0.2 0.7 --termination individuals --max-individuals 1000 --generations 500 --population-size 100 --parallel 1 --out-dir experiments/configs-matched --pin-vintage"

# One phase. A second was declared and dropped before launch: it would have
# given counter AuRUS's 7200 s deadline on the six families where AuRUS's own
# first solution lands past 400 s, on the premise that a short horizon truncates
# counter there too. The 2026-08-28 rows falsify the premise -- at a 400 s search
# counter repairs 15 of 24 runs on humanoid-503, 24 of 24 on humanoid-458 and
# pcar-v2-888, and 14 to 17 of 24 on the two arbiters. Only humanoid-531 goes
# unrepaired, and all 24 of its runs died at the external cap with mean equal to
# max, so what fails there is the post-search gate rather than the search. The
# phase would have spent about 27 h of wall clock giving counter more of the one
# resource it already holds in surplus, which is the error the individuals budget
# exists to correct. Its time went into seeds instead.
phases = [ { profile = "matched", jobs = 16 } ]
