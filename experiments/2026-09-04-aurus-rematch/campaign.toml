name = "2026-09-04-aurus-rematch"
branch = "campaign/aurus-rematch"
profile = "rematch"

description = "counter against AuRUS at the engine main carries after #170, with the 2026-08-29-aurus-matched 2x2 repeated on the same 25 families, 30 seeds and 1000-individual budget. Supersedes that campaign, whose search path six commits have since moved and whose result was depressed by a 10.5% kill rate the final-filter speedup should mostly remove. The AuRUS arm is re-run in the same window rather than re-used, and the maximality scoring pass is budgeted in PLAN.md sections 8 and 9 rather than discovered afterwards."

# The aurus-matched split, unchanged. Both arms of a pair land on one host, so
# a host-level difference cannot enter a within-counter contrast.
hosts = { av2 = "0-14", av3 = "15-29" }

# The aurus-matched line, unchanged but for the output directory. Holding the
# generator fixed is what lets the two campaigns differ in the binary alone.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion weighted --sweeps G --levels mrs,aurus --metric log --weakening off --weights 0.1 0.2 0.7 --termination individuals --max-individuals 1000 --generations 500 --population-size 100 --parallel 1 --out-dir experiments/configs-rematch --pin-vintage"

# Two phases. Calibration runs first and its gate is in PLAN.md section 7: no
# campaign has run at this engine, so the archive's 1152.1 core-hours is an
# upper bound of unknown tightness and the main phase is not launched until the
# 48 calibration runs have priced it. Phases run in order and stop at the first
# failure, so declaring both here is safe.
# `calib` carries its own hosts table and must. `run_experiments.py --seeds`
# replaces a profile's seed list rather than intersecting with it, so the
# campaign-level split would hand the calibration 15 seeds a host and run 720
# rows where the design says 48 -- and `humanoid-742` alone, capped at 7200 s,
# would cost more than the archive's whole control cell. One seed a host is
# what the 2-seed profile means once the split is applied. A phase table may
# only narrow, and both hosts named here are declared above.
phases = [
    { name = "calib", profile = "rematch-calib", jobs = 16, hosts = { av2 = "0", av3 = "1" } },
    { name = "main",  profile = "rematch",       jobs = 16 },
]
