name = "assumption-reach"
branch = "campaign/assumption-reach"
profile = "assumption-reach"
description = "A 3x2 cross of the 2026-08-25 assumption-reach operators against search size, over 23 of the 25 TLSF families at a 7200s cap. The operator factor is reachoff (all five keys at their no-op values, which is the pre-2026-08-25 grammar stated rather than inherited), reach (the four assumption-construction keys on), and reachburst (those plus the mutation burst). The search factor is gen10/pop200 against gen40/pop400. The primary question is whether any of it reaches gyro-var1, gyro-var2 or lift, which counter repaired in 0 of the 60 runs the 2026-08-23 campaign gave them."

# Eight seeds, four per host, against the monotone campaign's twenty. The
# primary endpoint is a rate the control pins at zero, which takes few seeds to
# move off and many to estimate, and the design buys the former: exact McNemar
# needs six discordant pairs all pointing one way before any p under 0.05
# exists, so eight seeds over three target families require the operators to
# repair a quarter of target runs to register at all. Six seeds would require a
# third, four would require a half.
#
# The split gives av2 the low half, as every campaign on this corpus has, so a
# later top-up to twenty seeds resumes rather than re-runs: (spec, seed) is in
# the resume key and seed 5 must stay on the machine that first ran it.
hosts = { av2 = "0-3", av3 = "4-7" }

# Generated on the host at stage time, the branch carrying the declaration and
# not the config tree, which is untracked.
#
# Every flag matches the 2026-08-23-monotone declaration's except
# --sweeps/--levels, so the two archives differ in the binary and in sweep U's
# keys and in nothing else. No --pin-vintage, for the reason that declaration
# records: it writes run_well_separation from a gen_configs.DEFAULTS entry that
# does not track the binary.
build = "sh -c 'cmake --build build-release'"
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion --metric log --weakening off --sweeps U --levels reachoff-s,reach-s,reachburst-s,reachoff-l,reach-l,reachburst-l --ltlsynt-timeout 10000 --ltl2tgba-timeout 60000 --max-scoring-failure-rate 0.15 --out-dir experiments/configs-assumption-reach"

# One phase, six arms inside it, 552 runs per host. Estimated at 14.9 hours per
# host from the 2026-08-23 campaign's per-family mean wall times, the three
# large arms costing eight times the three small ones and the two families that
# saturate the cap excluded. The estimate is the reason the campaign fits 36
# hours with margin rather than filling it.
phases = [ { profile = "assumption-reach", jobs = 8 } ]
