name = "aurus-h2h"
branch = "feat/aurus-h2h"
profile = "aurus-h2h"
description = "counter against AuRUS on 14 shared TLSF families at a matched 7200s budget, both tools scored by compare against examples/<spec>/fixes."

# Seeds 0-19 split evenly. Unlike the paired campaigns there is nothing to
# cancel within a pair here -- the AuRUS arm is not seeded at all -- so the
# split is only about halving wall time.
hosts = { av2 = "0-9", av3 = "10-19" }

# jobs = 1 for the RAM reason the other TLSF profiles use: ltlsynt runs
# multi-GB per call on these specs and max_concurrent_realizability is a
# per-process cap, so a second concurrent counter would double the ceiling.
# It matters more here than usual, amba being the heaviest family in the
# corpus and newly uncensored at a 7200s cap.
phases = [ { profile = "aurus-h2h", jobs = 1 } ]

# The AuRUS arm is NOT a phase: campaign.py phases invoke run_experiments.py
# with a profile, and AuRUS runs through scripts/aurus_campaign.py instead.
# Launch it separately, after the counter phase, per PLAN.md.
