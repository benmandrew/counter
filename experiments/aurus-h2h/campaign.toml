name = "aurus-h2h"
branch = "feat/aurus-h2h"
profile = "aurus-h2h"
description = "counter against AuRUS on the AuRUS paper's 26 TLSF families at a matched 7200s budget, both tools scored by compare against examples/<spec>/fixes. The counter phase runs the H2H_TLSF_READY subset until the remaining families are imported."

# Seeds 0-19 split evenly. Unlike the paired campaigns there is nothing to
# cancel within a pair here -- the AuRUS arm is not seeded at all -- so the
# split is only about halving wall time.
hosts = { av2 = "0-9", av3 = "10-19" }

# The configs are generated on the host, at stage time, because nothing else
# puts them there: the branch carries the declaration but not the config tree,
# which is untracked, and run_experiments.py exits 1 on an empty configs
# directory. av3 had none when this was first enqueued and burned two of its
# three attempts before anyone looked. --pin-vintage states every key whose
# default has moved, so the archive says what this run was rather than
# inheriting it from whatever the defaults become.
configs = "python3 scripts/gen_configs.py --schemes nsga2-apportion --sweeps C --levels default --metric log --out-dir experiments/configs-aurus-h2h --pin-vintage"

# jobs = 8, against the RAM reason the other TLSF profiles set it to 1: ltlsynt
# runs multi-GB per call and max_concurrent_realizability is a per-process cap,
# so N concurrent counters multiply the ceiling by N. That argument was never
# measured on this corpus, and it is wrong here. A 24-run calibration over 12
# families at 2 seeds, deliberately sized so the queue stayed saturated rather
# than fitting the worker count, peaked at load 21.7 of 32 cores and 18.7 GB of
# 125 GB. ltlfilt, not ltlsynt, is this project's memory hog.
#
# The cost of the old value was not small: at jobs = 1 this campaign runs about
# 31 hours per host against roughly 4, and two thirds of that is humanoid-742
# alone, which caps at 7200s on every seed.
phases = [ { profile = "aurus-h2h", jobs = 8 } ]

# The AuRUS arm is NOT a phase: campaign.py phases invoke run_experiments.py
# with a profile, and AuRUS runs through scripts/aurus_campaign.py instead.
# Launch it separately, after the counter phase, per PLAN.md.
