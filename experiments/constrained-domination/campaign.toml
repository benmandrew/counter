name = "constrained-domination"
branch = "campaign/constrained-domination"
profile = "constrained-dom"
description = "Deb's constrained domination against plain Pareto domination inside NSGA-II, on the 21 cost-affordable TLSF families at the shipping selection scheme and status grading. genetic.constrained_domination is the only key that differs between the arms."

# Seeds 0-29 split evenly. Both arms of a pair run on the same host, so the
# split is over seeds and never over levels -- run_experiments.py crosses the
# sweep levels itself, and a host difference then cancels within the
# (spec, seed) pair the endpoint is read over.
#
# 30 rather than selection-smoke's 16, because this campaign has the night
# rather than that one's 2 h/host and because 630 pairs supports a per-family
# read. The arms do not cost alike: a 12-case probe over 6 families reads a
# median paired wall ratio of 1.67 for cdon and a maximum of 2.71, so at that
# campaign's 88.45 s control mean this is 15 x 21 x (88.45 + 148) s a host,
# about 20.7 serial hours, roughly 3 h at jobs = 8 and inside the night at
# twice that. The profile's timeout caps are scaled by 1.7 for the same reason.
hosts = { av2 = "0-14", av3 = "15-29" }

# Generated on the host at stage time: the branch carries this declaration but
# not the config tree, which is untracked, and run_experiments.py exits 1 on an
# empty configs directory.
#
# Sweep K's two levels each pin p_monotone, p_clone_assumption, elitism_rate
# and accumulate_repairs at today's config.hpp values, as sweep T's `monoon`
# does, so a row here is readable against 2026-08-26-selection-smoke and
# 2026-08-23-monotone rather than against whatever the binary defaulted to.
# The two emitted configs differ in exactly one line, constrained_domination.
#
# --weights 0.2 0.5 0.5 is the binary's own triple rather than gen_configs.py's
# 0.33/0.33/0.33, which is neither a default nor anything a user gets. Under
# nsga2-apportion the weights never enter selection -- both arms rank by
# domination -- so this chooses what best_fitness reports and nothing else.
configs = "python3 scripts/gen_configs.py --tlsf --schemes nsga2-apportion --sweeps K --metric log --weakening off --weights 0.2 0.5 0.5 --out-dir experiments/configs-constrained-dom --pin-vintage"

# jobs = 8, as selection-smoke and monotone ran it on this corpus, which is
# what makes this campaign's wall times readable against theirs.
phases = [ { profile = "constrained-dom", jobs = 8 } ]
