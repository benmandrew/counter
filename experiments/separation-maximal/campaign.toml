# The maximal-and-separated pass over both arms of the 2026-09-04 rematch.
#
# experiments/separation-curves measured the epsilon net over every
# gate-passing candidate, which needed no solver call. This measures it over
# the maximal antichain instead, which needs the implication sweep, and the
# two answer different questions: the first counts distinct repairs a run
# holds, the second counts repairs that are distinct *and* not dominated by
# another the run also holds.
#
# Two changes make the sweep affordable. It prefilters on the same sampled
# words -- a word one candidate accepts and another rejects settles that
# direction of the implication with no solver call, and that settles 95.9% of
# the ordered pairs of a 421-candidate round-robin-arbiter-aurus set; measured
# over 80 candidates the tool went from 6.415s to 0.341s with byte-identical
# output. And the pass is now one `maximal --curve` walk a run rather than a
# process per time cut, comparing each arrival against the running antichain
# alone. The 2026-09-07 pass's 311.7 worker-hours is not the budget here.
#
# ideals = "off": `compare` is not needed for either metric and the maximality
# pass of 2026-09-07 already recorded the ideal-implying counts. The word
# count and seed match separation-curves so the two passes' epsilon columns
# are on one sampling and can be read against each other.
name = "separation-maximal"
branch = "feat/fingerprint-curves"
configs = "python3 scripts/aurus_adapt.py --root ~/aurus-h2h-out --out experiments/results-aurus-curves"
hosts = { av2 = "0-14", av3 = "15-29" }

# The calibration ran and is not repeated. It priced the pass as it stood at
# 051152d, a `maximal` process per time cut: 190 runs over the two hosts, one
# seed each, at a mean of 138s and a maximum of 3022s for 26,193s of scorer
# wall. One seed a host is 100 of that host's 1500 runs, so the full phase is
# 15x -- 109 scorer-hours, about 6.8 hours of wall over the two hosts at 8
# workers each. Its seed 4 carries humanoid-531, the largest accumulated set
# in the corpus at 727 candidates, so the worst case was inside the sample
# rather than extrapolated to.
#
# The two phases below run against the running antichain instead, which is the
# same output by a cheaper route -- the scorer's CSV and both sidecars are
# byte-identical over the three run directories the change was validated on --
# so the figure above is an upper bound rather than the estimate. It is not
# re-calibrated: the pass is bounded per run by deadline_s either way, and the
# calibration would cost a share of the thing it is pricing.
#
# [[phases]]
# name = "calib"
# kind = "score"
# results = "experiments/results-rematch"
# out = "experiments/separation-maximal-calib"
# hosts = { av2 = "4", av3 = "19" }
# workers = 8
# cores = 4
# maximality = "on"
# ideals = "off"
# epsilon = "0.05,0.2,0.5"
# fingerprint_words = 256
# fingerprint_seed = 0
# cuts = 20
# maximal_timeout = 900
# compare_timeout = 600
# deadline_s = 4500

[[phases]]
name = "counter"
kind = "score"
results = "experiments/results-rematch"
out = "experiments/separation-maximal-rematch"
workers = 8
cores = 4
maximality = "on"
ideals = "off"
epsilon = "0.05,0.2,0.5"
fingerprint_words = 256
fingerprint_seed = 0
cuts = 20
maximal_timeout = 900
compare_timeout = 600
deadline_s = 4500

[[phases]]
name = "aurus"
kind = "score"
results = "experiments/results-aurus-curves"
out = "experiments/separation-maximal-aurus"
workers = 8
cores = 4
maximality = "on"
ideals = "off"
epsilon = "0.05,0.2,0.5"
fingerprint_words = 256
fingerprint_seed = 0
cuts = 20
maximal_timeout = 900
compare_timeout = 600
deadline_s = 4500
