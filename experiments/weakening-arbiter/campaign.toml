name = "weakening-arbiter"
branch = "campaign/weakening-arbiter"
profile = "weakening-arbiter"
description = "Does the weakening filter cost reachable repairs on the arbiter families? run_weakening on against off over the 10 arbiter-probe TLSF specs at gen10/pop200, nsga2-truncate."

# gen_configs writes into experiments/, which is ignored by content, so the
# configs cannot be carried on the branch and have to be regenerated wherever
# the campaign runs. The build command is the only hook that runs on the host
# after checkout and before the phases, so it carries both steps.
build = "cmake --build build-release && python3 scripts/gen_configs.py --tlsf --weakening both --sweeps A --levels gen10 --out-dir experiments/configs-wkarb"

# 20 seeds split evenly. Both arms of a pair run on the same host, so a host
# difference cancels within the (spec, seed) pair the yield difference is
# measured over. PLAN.md §3 sizes the seed count: 10 per host at jobs=1 is
# ~44 min of counter against arbiter-probe's measured 131 s per seed over
# these 10 specs, which is the one-hour budget this campaign was asked for.
hosts = { av2 = "0-9", av3 = "10-19" }

# jobs = 1 for the RAM reason every TLSF profile uses: ltlsynt runs multi-GB
# per call on the arbiter specs and max_concurrent_realizability is a
# per-process cap, so a second concurrent counter would double the ceiling.
phases = [ { profile = "weakening-arbiter", jobs = 1 } ]
