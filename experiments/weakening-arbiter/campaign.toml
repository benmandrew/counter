name = "weakening-arbiter"
branch = "campaign/weakening-arbiter"
profile = "weakening-arbiter"
description = "Does the weakening filter cost reachable repairs on the arbiter families? run_weakening on against off over the 10 arbiter-probe TLSF specs at gen10/pop200, nsga2-truncate."

# gen_configs writes into experiments/, which is ignored by content, so the
# configs cannot be carried on the branch and have to be regenerated wherever
# the campaign runs. The build command is the only hook that runs on the host
# after checkout and before the phases, so it carries both steps.
# Wrapped in `sh -c` deliberately. campaign.py embeds this verbatim as
# `if ! @BUILD@ > "$buildlog"; then`, and `!` binds to the first pipeline
# of an AND-list: a bare `a && b` here runs `a`, short-circuits `b` away,
# and still reports the stage a success. That silently staged both hosts
# with no configs on 2026-08-19 and both runners exited on the spot.
build = "sh -c 'cmake --build build-release && python3 scripts/gen_configs.py --tlsf --weakening both --sweeps A --levels gen10 --out-dir experiments/configs-wkarb'"

# 20 seeds split evenly. Both arms of a pair run on the same host, so a host
# difference cancels within the (spec, seed) pair the yield difference is
# measured over. PLAN.md §3 sizes the seed count: 10 per host at jobs=1 is
# ~44 min of counter against arbiter-probe's measured 131 s per seed over
# these 10 specs, which is the one-hour budget this campaign was asked for.
hosts = { av2 = "0-9", av3 = "10-19" }

# jobs = 1 for the RAM reason every TLSF profile uses: ltlsynt runs multi-GB
# per call on the arbiter specs and max_concurrent_realizability is a
# per-process cap, so a second concurrent counter would double the ceiling.
[[phases]]
profile = "weakening-arbiter"
jobs = 1
# Corpus cut from 10 families to 6 after 24 rows, see PLAN.md section 10. The
# cost model came from the 2026-08-10 arbiter-probe archive, which predates MRS
# status grading as the default (1.89x) and p_remove_guarantee, so per-run cost
# is ~6x what it predicted. amba hit the 900 s cap in both arms and returned
# nothing, taking ~88% of the wall time on its own; round-robin-arbiter,
# simple-arbiter and load-balancer already yield under wkon and are the next
# most expensive. full-arbiter and prioritized-arbiter, the two zero-yield
# families the question is about, are kept, and the seed count is untouched.
specs = ["arbiter", "arbiter-aurus", "arbiter-handshake", "full-arbiter", "prioritized-arbiter", "lily02"]
